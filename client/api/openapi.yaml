  /document-ai/document/extract/split:
    post:
      description: "Analyzes a document containing multiple sub-documents (such as\
        \ a scanned batch of ID cards, forms, or mixed documents) and intelligently\
        \ splits it into separate sub-documents.  Uses AI to detect document boundaries\
        \ based on visual content, headers, names, and document types.  Returns the\
        \ page ranges and PDF bytes for each identified sub-document.  Input document\
        \ formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and\
        \ WEBP.  Consumes 100 API calls per page."
      operationId: ExtractSplit
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractSplit_request"
