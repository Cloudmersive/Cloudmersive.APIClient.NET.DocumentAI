        ExtractFieldsResult:
          Results:
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
          Successful: true
        AsyncJobID: AsyncJobID
        ErrorMessage: ErrorMessage
        Successful: true
        AsyncJobStatus: AsyncJobStatus
      properties:
        Successful:
          description: "True if the operation to check the status of the job was successful,\
            \ false otherwise"
          type: boolean
        AsyncJobStatus:
          description: "Returns the job status of the Async Job, if applicable.  Possible\
            \ states are STARTED and COMPLETED"
          type: string
        AsyncJobID:
          description: Job ID
          type: string
        ExtractTextResult:
          $ref: "#/components/schemas/ExtractTextResponse"
        ExtractFieldsAndTablesResult:
          $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
        ExtractFieldsResult:
          $ref: "#/components/schemas/ExtractFieldsResponse"
        ExtractClassificationResult:
          $ref: "#/components/schemas/DocumentClassificationResult"
        ErrorMessage:
          description: Error message (if any)
          type: string
      type: object
    ExtractFieldsAdvancedResponse:
      additionalProperties: false
      description: Result of extracting fields from a document
      example:
        Results:
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
        ConfidenceScore: 0.8008281904610115
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        Results:
          description: Field value results from the extraction operation
          items:
            $ref: "#/components/schemas/FieldAdvancedValue"
          type: array
        ConfidenceScore:
          description: "Confidence score between 0.0 and 1.0, where values > 0.8 indicate\
            \ high confidence"
          format: double
          type: number
      type: object
    ExtractFieldsAndTablesResponse:
      additionalProperties: false
      description: Result of extracting fields from a document
      example:
        TableResults:
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        Successful: true
        FieldResults:
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        FieldResults:
          description: Field value results from the extraction operation
          items:
            $ref: "#/components/schemas/FieldValue"
          type: array
        TableResults:
          description: Table value results from the extraction operation
          items:
            $ref: "#/components/schemas/TableResult"
          type: array
      type: object
    ExtractFieldsResponse:
      additionalProperties: false
      description: Result of extracting fields from a document
      example:
        Results:
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        Results:
          description: Field value results from the extraction operation
          items:
            $ref: "#/components/schemas/FieldValue"
          type: array
      type: object
    ExtractTablesResponse:
      additionalProperties: false
      description: Result of extracting tables from a document
      example:
        TableResults:
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        TableResults:
          description: Table value results from the extraction operation
          items:
            $ref: "#/components/schemas/TableResult"
          type: array
      type: object
    ExtractTextResponse:
      additionalProperties: false
      description: Result of extracting text from a document
      example:
        PageResults:
        - TextResult: TextResult
          PageNumber: 0
        - TextResult: TextResult
          PageNumber: 0
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        PageResults:
          description: Page results from the extraction operation
          items:
            $ref: "#/components/schemas/ExtractedTextPage"
          type: array
      type: object
    ExtractedBarcodeItem:
      additionalProperties: false
      description: Extracted barcode result
      example:
        BarcodeValue: BarcodeValue
        BarcodeType: BarcodeType
      properties:
        BarcodeType:
          description: "Type of the barcode identified, possible values are: AZTEC,\
            \ CODABAR, CODE_39, CODE_93, CODE_128, DATA_MATRIX, EAN_8, EAN_13, ITF,\
            \ MAXICODE, PDF_417, QR_CODE, RSS_14, RSS_EXPANDED, UPC_A, UPC_E, All_1D,\
            \ UPC_EAN_EXTENSION, MSI, PLESSEY, IMB, UNKNOWN"
          type: string
        BarcodeValue:
          description: Value of the barcode as a string
          type: string
      type: object
    ExtractedTextPage:
      additionalProperties: false
      description: Extracted page from an input document
      example:
        TextResult: TextResult
        PageNumber: 0
      properties:
        PageNumber:
          description: "Page number index, 1-based"
          format: int32
          type: integer
        TextResult:
          description: Text content of the page
          type: string
      type: object
    FieldAdvancedValue:
      additionalProperties: false
      description: Field value result of extracting fields from a document
      example:
        FieldName: FieldName
        FieldStringValue: FieldStringValue
      properties:
        FieldName:
          description: Name of the field (note that spaces will be replaced with underscore)
          type: string
        FieldStringValue:
          description: String value of the field that was extractged from the document
          type: string
      type: object
    FieldToExtract:
      additionalProperties: false
      description: Field to extract from a document using AI
      example:
        FieldOptional: true
        FieldExample: FieldExample
        FieldName: FieldName
        FieldDescription: FieldDescription
      properties:
        FieldName:
          description: Name of the field to extract
          type: string
        FieldOptional:
          description: "Optional: True if the field is optional, false if required\
            \ (default)"
          type: boolean
        FieldDescription:
          description: "Optional but recommended: Description of the field - use this\
            \ to describe what the field is, how it is formatted, what is unique about\
            \ it, etc."
          type: string
        FieldExample:
          description: "Optional: Example label or value of the field"
          type: string
      type: object
    FieldValue:
      additionalProperties: false
      description: Field value result of extracting fields from a document
      example:
        FieldName: FieldName
        FieldStringValue: FieldStringValue
        AdditionalFieldStringValues:
        - AdditionalFieldStringValues
        - AdditionalFieldStringValues
      properties:
        FieldName:
          description: Name of the field (note that spaces will be replaced with underscore)
          type: string
        FieldStringValue:
          description: Primary or first string value of the field that was extractged
            from the document
          type: string
        AdditionalFieldStringValues:
          description: "Additional values for this field when the same field is present\
            \ with multiple values, for example, if two instances of the same form\
            \ occur in the same document"
          items:
            type: string
          type: array
      type: object
    PolicyRule:
      additionalProperties: false
      example:
        RuleDescription: RuleDescription
        RuleId: RuleId
        RuleType: RuleType
      properties:
        RuleId:
          description: ""
          type: string
        RuleType:
          description: Possible values are ALLOW and DENY
          type: string
        RuleDescription:
          description: "Description of the rule in natural language, e.g. Do not allow\
            \ documents that contain offensive language"
          type: string
      type: object
    PolicyRuleViolation:
      additionalProperties: false
      description: Instances of a policy rule violation
      example:
        RuleId: RuleId
        RuleViolationRiskScore: 6.027456183070403
        RuleViolationRationale: RuleViolationRationale
      properties:
        RuleId:
          description: "ID of the rule; if no ID was supplied, the ID is the 1-based\
            \ index of the rule"
          type: string
        RuleViolationRiskScore:
          description: Risk score between 0.0 and 1.0 where values above 0.5 are increasing
            levels of risk
          format: double
          type: number
        RuleViolationRationale:
          description: AI natural language rationale for why this policy was violated
          type: string
      type: object
    SplitDocumentResponse:
      additionalProperties: false
      description: Result of splitting a document into sub-documents
      example:
        SubDocuments:
        - EndPage: 6
          StartPage: 0
          DocumentDescription: DocumentDescription
          FileBytes: FileBytes
        - EndPage: 6
          StartPage: 0
          DocumentDescription: DocumentDescription
          FileBytes: FileBytes
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        SubDocuments:
          description: The sub-documents that were identified and extracted from the
            input document
          items:
            $ref: "#/components/schemas/SubDocument"
          type: array
      type: object
    SubDocument:
      additionalProperties: false
      description: A sub-document extracted from a combined document
      example:
        EndPage: 6
        StartPage: 0
        DocumentDescription: DocumentDescription
        FileBytes: FileBytes
      properties:
        StartPage:
          description: Starting page number (1-indexed) of this sub-document in the
            original document
          format: int32
          type: integer
        EndPage:
          description: Ending page number (1-indexed) of this sub-document in the
            original document
          format: int32
          type: integer
        DocumentDescription:
          description: Description of the sub-document including document type and
            any identifying information such as person name
          type: string
        FileBytes:
          description: The extracted sub-document as PDF file bytes
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
      type: object
    SummarizeDocumentResponse:
      additionalProperties: false
      description: Result of summarizing a document
      example:
        Successful: true
        DocumentSummaryText: DocumentSummaryText
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        DocumentSummaryText:
          description: Summary of the document
          type: string
      type: object
    TableResult:
      additionalProperties: false
      description: Table extracted from a document
      example:
        Title: Title
        Rows:
        - Cells:
          - CellValue: CellValue
            CellHeader: CellHeader
          - CellValue: CellValue
            CellHeader: CellHeader
        - Cells:
          - CellValue: CellValue
            CellHeader: CellHeader
          - CellValue: CellValue
            CellHeader: CellHeader
      properties:
        Title:
          description: Title of the table (optional)
          type: string
        Rows:
          description: Rows of the table
          items:
            $ref: "#/components/schemas/TableResultRow"
          type: array
      type: object
    TableResultCell:
      additionalProperties: false
      description: Cell of a row of a table extracted from a document
      example:
        CellValue: CellValue
        CellHeader: CellHeader
      properties:
        CellHeader:
          description: Cell column header
          type: string
        CellValue:
          description: Cell value as a string
          type: string
      type: object
    TableResultRow:
      additionalProperties: false
      description: Row of a table extracted from a document
      example:
        Cells:
        - CellValue: CellValue
          CellHeader: CellHeader
        - CellValue: CellValue
          CellHeader: CellHeader
      properties:
        Cells:
          description: Cells in the row
          items:
            $ref: "#/components/schemas/TableResultCell"
          type: array
      type: object
    ExtractText_request:
      properties:
        InputFile:
          description: "Input document, or photos of a document, to extract data from"
          format: binary
          type: string
      type: object
    ExtractSplit_request:
      properties:
        InputFile:
          description: Input document containing multiple sub-documents to split
          format: binary
          type: string
      type: object
  securitySchemes:
    Apikey:
      description: API Key Authentication
      in: header
      name: Apikey
      type: apiKey
