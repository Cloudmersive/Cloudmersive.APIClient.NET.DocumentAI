        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
          description: OK
      summary: Extract Classification or Category from a Document using AI as a Batch
        Job
      tags:
      - RunBatchJob
  /document-ai/document/batch-job/batch-job/status:
    get:
      description: Returns the result of the Async Job - possible states can be STARTED
        or COMPLETED.  This API is only available for Cloudmersive Managed Instance
        and Private Cloud deployments.
      operationId: GetAsyncJobStatus
      parameters:
      - description: Job ID for the batch job to get the status of
        in: query
        name: AsyncJobID
        schema:
          type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentJobStatusResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentJobStatusResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentJobStatusResult"
          description: OK
      summary: Get the status and result of an Extract Document Batch Job
      tags:
      - RunBatchJob
components:
  schemas:
    AdvancedExtractClassificationRequest:
      additionalProperties: false
      description: Request to perform an AI document classification on a document
      example:
        MaximumPagesProcessed: 0
        Preprocessing: Preprocessing
        Categories:
        - CategoryName: CategoryName
          CategoryDescription: CategoryDescription
        - CategoryName: CategoryName
          CategoryDescription: CategoryDescription
        ResultCrossCheck: ResultCrossCheck
        RotateImageDegrees: 6.027456183070403
        InputFile: InputFile
      properties:
        InputFile:
          description: Input document file to perform the operation on as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        Categories:
          description: Possible categories for the document
          items:
            $ref: "#/components/schemas/DocumentCategories"
          type: array
        Preprocessing:
          description: "Optional: Set the level of image pre-processing to enhance\
            \ accuracy.  Possible values are 'Auto', 'SmoothEdges', 'SmoothEdgesPlus',\
            \ 'Compatability' and 'None'.  Default is Auto.  Set to SmoothEdges to\
            \ smooth harsh edges in the input image to enhance recognition accuracy.\
            \  Set to SmoothEdgesPlus to smooth harsh edges to a higher degree.  Set\
            \ to Compatability for maximum PDF feature compatability."
          type: string
        ResultCrossCheck:
          description: "Optional: Set the level of output accuracy cross-checking\
            \ to perform on the input.  Possible values are 'None', 'Advanced', 'Ultra'\
            \ and 'Hyper'.  Default is None.  Ultra and Hyper will produce the highest\
            \ accuracy but at the cost of longer processing times."
          type: string
        MaximumPagesProcessed:
          description: "Optional: Limit the number of pages processed"
          format: int32
          type: integer
        RotateImageDegrees:
          description: "Optional: Rotate the input image before recognition by the\
            \ specified number of degrees; valid values range from -360 to +360."
          format: double
          type: number
      type: object
    AdvancedExtractFieldsRequest:
      additionalProperties: false
      description: Request to perform an AI field extraction on a document
      example:
        MaximumPagesProcessed: 0
        Preprocessing: Preprocessing
        ResultCrossCheck: ResultCrossCheck
        RotateImageDegrees: 6.027456183070403
        FieldsToExtract:
        - FieldOptional: true
          FieldExample: FieldExample
          FieldName: FieldName
          FieldDescription: FieldDescription
        - FieldOptional: true
          FieldExample: FieldExample
          FieldName: FieldName
          FieldDescription: FieldDescription
        InputFile: InputFile
      properties:
        InputFile:
          description: Input document file to perform the operation on as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        FieldsToExtract:
          description: Fields to extract from the document
          items:
            $ref: "#/components/schemas/FieldToExtract"
          type: array
        MaximumPagesProcessed:
          description: "Optional: Limit the number of pages processed"
          format: int32
          type: integer
        Preprocessing:
          description: "Optional: Set the level of image pre-processing to enhance\
            \ accuracy.  Possible values are 'Auto', 'SmoothEdges', 'SmoothEdgesPlus',\
            \ 'ContrastEdges', 'ContrastEdgesPlus', 'Invert', 'Binarize', 'Compatability'\
            \ and 'None'.  Default is Auto.  Set to SmoothEdges to smooth harsh edges\
            \ in the input image to enhance recognition accuracy.  Set to SmoothEdgesPlus\
            \ to smooth harsh edges to a higher degree.  Set to ContrastEdges and\
            \ ContrastEdgesPlus to enhance contrast and readability for low quality\
            \ black and white or grayscale images.  Set to Invert to invert the input\
            \ image.  Set to Binarize to binarize the input image.  Set to Compatability\
            \ for maximum PDF feature compatability."
          type: string
        ResultCrossCheck:
          description: "Optional: Set the level of output accuracy cross-checking\
            \ to perform on the input.  Possible values are 'None', 'Advanced' and\
            \ 'Ultra'.  Default is None.  Ultra will produce the highest accuracy\
            \ but at the cost of longer processing times."
          type: string
        RotateImageDegrees:
          description: "Optional: Rotate the input image before recognition by the\
            \ specified number of degrees; valid values range from -360 to +360."
          format: double
          type: number
      type: object
    DocumentAdvancedClassificationResult:
      additionalProperties: false
      description: Result of classifying a document using AI
      example:
        DocumentCategoryResult: DocumentCategoryResult
        ConfidenceScore: 0.8008281904610115
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        DocumentCategoryResult:
          description: Category applied to the document; if a category could not be
            identified then "other" will be used.  Spaces are replaced with underscores.
          type: string
        ConfidenceScore:
          description: "Confidence score between 0.0 and 1.0, where values > 0.8 indicate\
            \ high confidence"
          format: double
          type: number
      type: object
    DocumentCategories:
      additionalProperties: false
      description: Document category option
      example:
        CategoryName: CategoryName
        CategoryDescription: CategoryDescription
      properties:
        CategoryName:
          description: Name of the classification
          type: string
        CategoryDescription:
          description: "Optional but recommended: Description of the classification\
            \ in natural langugage"
          type: string
      type: object
    DocumentClassificationResult:
      additionalProperties: false
      description: Result of classifying a document using AI
      example:
        DocumentCategoryResult: DocumentCategoryResult
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        DocumentCategoryResult:
          description: Category applied to the document; if a category could not be
            identified then "other" will be used.  Spaces are replaced with underscores.
          type: string
      type: object
    DocumentPolicyRequest:
      additionalProperties: false
      description: Request to analyze a document
      example:
        RecognitionMode: RecognitionMode
        Rules:
        - RuleDescription: RuleDescription
          RuleId: RuleId
          RuleType: RuleType
        - RuleDescription: RuleDescription
          RuleId: RuleId
          RuleType: RuleType
        InputFile: InputFile
      properties:
        InputFile:
          description: Input file as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        Rules:
          description: Rules to apply to the document
          items:
            $ref: "#/components/schemas/PolicyRule"
          type: array
        RecognitionMode:
          description: "Optional; Recognition mode - Normal (default) provides the\
            \ highest accuracy but slower speed, while Normal provides faster response\
            \ but lower accuracy for low quality images"
          type: string
      type: object
    DocumentPolicyResult:
      additionalProperties: false
      description: Result of performing a document policy enforcement operation
      example:
        RiskScore: 0.8008281904610115
        RuleViolations:
        - RuleId: RuleId
          RuleViolationRiskScore: 6.027456183070403
          RuleViolationRationale: RuleViolationRationale
        - RuleId: RuleId
          RuleViolationRiskScore: 6.027456183070403
          RuleViolationRationale: RuleViolationRationale
        CleanResult: true
      properties:
        CleanResult:
          description: "True if the document complies with all of the policies, and\
            \ false if it does not"
          type: boolean
        RiskScore:
          description: Risk score between 0.0 and 1.0 where values above 0.5 are increasing
            levels of risk
          format: double
          type: number
        RuleViolations:
          description: Policy violations
          items:
            $ref: "#/components/schemas/PolicyRuleViolation"
          type: array
      type: object
    DocumentQuestionAnswerItem:
      additionalProperties: false
      description: Answer to an input question
      example:
        AnswerValue: AnswerValue
        QuestionId: QuestionId
        ConfidenceScore: 6.027456183070403
        AnswerRationale: AnswerRationale
      properties:
        QuestionId:
          description: ID of the input question
          type: string
        AnswerValue:
          description: "Answer response value, formatted as a string, for this question.\
            \  Boolean questions will return YES or NO."
          type: string
        AnswerRationale:
          description: Rationale explaining why this answer was given
          type: string
        ConfidenceScore:
          description: Confidence score between 0.0 and 1.0 where values above 0.8
            indicate high confidence
          format: double
          type: number
      type: object
    DocumentQuestionAnswersResult:
      additionalProperties: false
      description: Result of performing a document question answering operation
      example:
        ConfidenceScore: 0.8008281904610115
        AnswerResults:
        - AnswerValue: AnswerValue
          QuestionId: QuestionId
          ConfidenceScore: 6.027456183070403
          AnswerRationale: AnswerRationale
        - AnswerValue: AnswerValue
          QuestionId: QuestionId
          ConfidenceScore: 6.027456183070403
          AnswerRationale: AnswerRationale
        Successful: true
      properties:
        Successful:
          description: "True if the operation was completed successfully, or false\
            \ otherwise"
          type: boolean
        ConfidenceScore:
          description: Confidence score between 0.0 and 1.0 where values above 0.8
            indicate high confidence
          format: double
          type: number
        AnswerResults:
          items:
            $ref: "#/components/schemas/DocumentQuestionAnswerItem"
          type: array
      type: object
    DocumentQuestionBoolean:
      additionalProperties: false
      description: Boolean document question
      example:
        QuestionId: QuestionId
        QuestionText: QuestionText
      properties:
        QuestionId:
          description: "Unique ID of the question, e.g. 1 or 2A"
          type: string
        QuestionText:
          description: "Question in natural language to ask of the document where\
            \ the answer resolves to YES or NO, e.g. 'Is this document signed and\
            \ countersigned by both parties?'"
          type: string
      type: object
    DocumentQuestionChoiceItem:
      additionalProperties: false
      description: Possible response choice for a multiple-choice question
      example:
        ChoiceText: ChoiceText
        ChoiceId: ChoiceId
      properties:
        ChoiceId:
          description: "Unique ID of the response choice, e.g. 3C"
          type: string
        ChoiceText:
          description: "Description text of this choice, e.g. 'Delaware'"
          type: string
      type: object
    DocumentQuestionFreeResponse:
      additionalProperties: false
      description: Free response question
      example:
        QuestionId: QuestionId
        QuestionText: QuestionText
      properties:
        QuestionId:
          description: "Unique ID of the question, e.g. 7 or 5A"
          type: string
        QuestionText:
          description: "Question in natural language to ask of the document where\
            \ the answer resolves to a free response, e.g. 'Who is the counterparty\
            \ in this agreement?'"
          type: string
      type: object
    DocumentQuestionMultipleChoice:
      additionalProperties: false
      description: Multiple choice question
      example:
        ResponseChoices:
        - ChoiceText: ChoiceText
          ChoiceId: ChoiceId
        - ChoiceText: ChoiceText
          ChoiceId: ChoiceId
        QuestionId: QuestionId
        QuestionText: QuestionText
      properties:
        QuestionId:
          description: "Unique ID of the question, e.g. 1 or 2A"
          type: string
        QuestionText:
          description: "Question in natural language to ask of the document where\
            \ the answer resolves to one of a fixed number of provided choices, e.g.\
            \ 'What is the governing law of this agreement?'"
          type: string
        ResponseChoices:
          description: Possible response choices for the multiple-choice question
          items:
            $ref: "#/components/schemas/DocumentQuestionChoiceItem"
          type: array
      type: object
    DocumentQuestionsRequest:
      additionalProperties: false
      example:
        QuestionsFreeResponse:
        - QuestionId: QuestionId
          QuestionText: QuestionText
        - QuestionId: QuestionId
          QuestionText: QuestionText
        QuestionsMultipleChoice:
        - ResponseChoices:
          - ChoiceText: ChoiceText
            ChoiceId: ChoiceId
          - ChoiceText: ChoiceText
            ChoiceId: ChoiceId
          QuestionId: QuestionId
          QuestionText: QuestionText
        - ResponseChoices:
          - ChoiceText: ChoiceText
            ChoiceId: ChoiceId
          - ChoiceText: ChoiceText
            ChoiceId: ChoiceId
          QuestionId: QuestionId
          QuestionText: QuestionText
        QuestionsYesNo:
        - QuestionId: QuestionId
          QuestionText: QuestionText
        - QuestionId: QuestionId
          QuestionText: QuestionText
        RecognitionMode: RecognitionMode
        InputFile: InputFile
      properties:
        InputFile:
          description: Input file as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        QuestionsYesNo:
          description: "Optional: Yes or No boolean questions to answer about the\
            \ document"
          items:
            $ref: "#/components/schemas/DocumentQuestionBoolean"
          type: array
        QuestionsMultipleChoice:
          description: "Optional: Multiple choice questions to answer about the document"
          items:
            $ref: "#/components/schemas/DocumentQuestionMultipleChoice"
          type: array
        QuestionsFreeResponse:
          description: "Optional: Free response questions to answer about the document"
          items:
            $ref: "#/components/schemas/DocumentQuestionFreeResponse"
          type: array
        RecognitionMode:
          description: "Optional; Recognition mode - Normal (default) provides the\
            \ highest accuracy but slower speed, while Normal provides faster response\
            \ but lower accuracy for low quality images"
          type: string
      type: object
    ExtractBarcodesAiResponse:
      additionalProperties: false
      description: Result of extracting barcodes from a document
      example:
        BarcodeResults:
        - BarcodeValue: BarcodeValue
          BarcodeType: BarcodeType
        - BarcodeValue: BarcodeValue
          BarcodeType: BarcodeType
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        BarcodeResults:
          description: Table value results from the extraction operation
          items:
            $ref: "#/components/schemas/ExtractedBarcodeItem"
          type: array
      type: object
    ExtractDocumentBatchJobResult:
      additionalProperties: false
      description: Result of performing a split document batch job
