      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        AsyncJobID:
          description: "When creating a job, an Async Job ID is returned.  Use the\
            \ GetAsyncJobStatus API to check on the status of this job using the AsyncJobID\
            \ and get the result when it finishes"
          type: string
      type: object
    ExtractDocumentJobStatusResult:
      additionalProperties: false
      description: Result of performing a batch job operation
      example:
        ExtractFieldsAndTablesResult:
          TableResults:
          - Title: Title
            Rows:
            - Cells:
              - CellValue: CellValue
                CellHeader: CellHeader
              - CellValue: CellValue
                CellHeader: CellHeader
            - Cells:
              - CellValue: CellValue
                CellHeader: CellHeader
              - CellValue: CellValue
                CellHeader: CellHeader
          - Title: Title
            Rows:
            - Cells:
              - CellValue: CellValue
                CellHeader: CellHeader
              - CellValue: CellValue
                CellHeader: CellHeader
            - Cells:
              - CellValue: CellValue
                CellHeader: CellHeader
              - CellValue: CellValue
                CellHeader: CellHeader
          Successful: true
          FieldResults:
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
        ExtractClassificationResult:
          DocumentCategoryResult: DocumentCategoryResult
          Successful: true
        ExtractTextResult:
          PageResults:
          - TextResult: TextResult
            PageNumber: 0
          - TextResult: TextResult
            PageNumber: 0
          Successful: true
        ExtractFieldsResult:
          Results:
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
          Successful: true
        AsyncJobID: AsyncJobID
        ErrorMessage: ErrorMessage
        Successful: true
        AsyncJobStatus: AsyncJobStatus
      properties:
        Successful:
          description: "True if the operation to check the status of the job was successful,\
            \ false otherwise"
          type: boolean
        AsyncJobStatus:
          description: "Returns the job status of the Async Job, if applicable.  Possible\
            \ states are STARTED and COMPLETED"
          type: string
        AsyncJobID:
          description: Job ID
          type: string
        ExtractTextResult:
          $ref: "#/components/schemas/ExtractTextResponse"
        ExtractFieldsAndTablesResult:
          $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
        ExtractFieldsResult:
          $ref: "#/components/schemas/ExtractFieldsResponse"
        ExtractClassificationResult:
          $ref: "#/components/schemas/DocumentClassificationResult"
        ErrorMessage:
          description: Error message (if any)
          type: string
      type: object
    ExtractFieldsAdvancedResponse:
      additionalProperties: false
      description: Result of extracting fields from a document
      example:
        Results:
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
        ConfidenceScore: 0.8008281904610115
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        Results:
          description: Field value results from the extraction operation
          items:
            $ref: "#/components/schemas/FieldAdvancedValue"
          type: array
        ConfidenceScore:
          description: "Confidence score between 0.0 and 1.0, where values > 0.8 indicate\
            \ high confidence"
          format: double
          type: number
      type: object
    ExtractFieldsAndTablesResponse:
      additionalProperties: false
      description: Result of extracting fields from a document
      example:
        TableResults:
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        Successful: true
        FieldResults:
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        FieldResults:
          description: Field value results from the extraction operation
          items:
            $ref: "#/components/schemas/FieldValue"
          type: array
        TableResults:
          description: Table value results from the extraction operation
          items:
            $ref: "#/components/schemas/TableResult"
          type: array
      type: object
    ExtractFieldsResponse:
      additionalProperties: false
      description: Result of extracting fields from a document
      example:
        Results:
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
        - FieldName: FieldName
          FieldStringValue: FieldStringValue
          AdditionalFieldStringValues:
          - AdditionalFieldStringValues
          - AdditionalFieldStringValues
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        Results:
          description: Field value results from the extraction operation
          items:
            $ref: "#/components/schemas/FieldValue"
          type: array
      type: object
    ExtractTablesResponse:
      additionalProperties: false
      description: Result of extracting tables from a document
      example:
        TableResults:
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        - Title: Title
          Rows:
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
          - Cells:
            - CellValue: CellValue
              CellHeader: CellHeader
            - CellValue: CellValue
              CellHeader: CellHeader
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        TableResults:
          description: Table value results from the extraction operation
          items:
            $ref: "#/components/schemas/TableResult"
          type: array
      type: object
    ExtractTextResponse:
      additionalProperties: false
      description: Result of extracting text from a document
      example:
        PageResults:
        - TextResult: TextResult
          PageNumber: 0
        - TextResult: TextResult
          PageNumber: 0
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        PageResults:
          description: Page results from the extraction operation
          items:
            $ref: "#/components/schemas/ExtractedTextPage"
          type: array
      type: object
    ExtractedBarcodeItem:
      additionalProperties: false
      description: Extracted barcode result
      example:
        BarcodeValue: BarcodeValue
        BarcodeType: BarcodeType
