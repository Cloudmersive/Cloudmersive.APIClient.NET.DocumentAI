          text/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractClassificationRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractClassificationRequest"
        description: Input request to perform the classification on
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DocumentAdvancedClassificationResult"
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAdvancedClassificationResult"
            text/json:
              schema:
                $ref: "#/components/schemas/DocumentAdvancedClassificationResult"
          description: OK
      summary: Extract Classification or Category from a Document using Advanced AI
      tags:
      - Extract
      x-codegen-request-body-name: body
