openapi: 3.0.1
info:
  contact:
    email: support@cloudmersive.com
    name: Cloudmersive
    url: https://www.cloudmersive.com
  description: "Extract structured data including named fields, tables, barcodes,\
    \ classifications, and summaries from common document formats, scanned documents,\
    \ and photos of documents using AI.  Also supports handwriting and low quality\
    \ photos and scans, as well as digital document input.  Supports a wide range\
    \ of languages, and is able to analyze and infer semantic structure from the visual\
    \ layout for documents."
  termsOfService: https://portal.cloudmersive.com/terms-of-service
  title: Document AI API
  version: v1
servers:
- url: https://api.cloudmersive.com/
security:
- Apikey: []
paths:
  /document-ai/document/analyze/enforce-policy:
    post:
      description: "Enforce Policies to a Document to allow or block it using Advanced\
        \ AI.  Input document formats supported include DOCX, PDF, PNG and JPG.  Consumes\
        \ 100 API calls per page."
      operationId: ApplyRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPolicyRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/DocumentPolicyRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/DocumentPolicyRequest"
        description: "Input request, including document and policy rules"
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DocumentPolicyResult"
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPolicyResult"
            text/json:
              schema:
                $ref: "#/components/schemas/DocumentPolicyResult"
          description: OK
      summary: Enforce Policies to a Document to allow or block it using Advanced
        AI
      tags:
      - Analyze
      x-codegen-request-body-name: body
  /document-ai/document/analyze/answer-questions:
    post:
      description: "Answer boolean (yes/no), multiple-choice and free-response questions\
        \ about the contents of a document using Advanced AI.  Input document formats\
        \ supported include DOCX, PDF, PNG and JPG.  Consumes 100 API calls per page."
      operationId: AnswerQuestions
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentQuestionsRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/DocumentQuestionsRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/DocumentQuestionsRequest"
        description: "Input request, including document and questions"
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DocumentQuestionAnswersResult"
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentQuestionAnswersResult"
            text/json:
              schema:
                $ref: "#/components/schemas/DocumentQuestionAnswersResult"
          description: OK
      summary: Answer Questions about a Document in a structured way using Advanced
        AI
      tags:
      - Analyze
      x-codegen-request-body-name: body
  /document-ai/document/extract/text:
    post:
      description: "Extract raw text from a document using AI.  Input document formats\
        \ supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Supports\
        \ a wide range of languages.  Consumes 100 API calls per page."
      operationId: ExtractText
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images.  Set to Deterministic to directly\
          \ extract text from digital documents without using AI."
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
          description: OK
      summary: Extract Text from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/fields:
    post:
      description: "Extract Field Values (e.g. Invoice Number, Invoice Date, Business\
        \ Card Phone Number, etc.) from a document using AI.  Input document formats\
        \ supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Consumes\
        \ 100 API calls per page."
      operationId: ExtractFields
      parameters:
      - description: "Desired fields to extract, comma separated"
        in: header
        name: FieldNames
        schema:
          type: string
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractFieldsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsResponse"
          description: OK
      summary: Extract Field Values from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/fields/advanced:
    post:
      description: "Extract Field Values (e.g. Invoice Number, Invoice Date, Business\
        \ Card Phone Number, etc.) from a document using Advanced AI.  Input document\
        \ formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and\
        \ WEBP.  Consumes 100 API calls per page."
      operationId: ExtractFieldsAdvanced
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
        description: "Input request, including document file as byte array, and information\
          \ on which fields to extract"
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAdvancedResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAdvancedResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAdvancedResponse"
          description: OK
      summary: Extract Field Values from a Document using Advanced AI
      tags:
      - Extract
      x-codegen-request-body-name: body
  /document-ai/document/extract/tables:
    post:
      description: "Extract Tables, comprised of rows and columns of data, from a\
        \ document using AI.  Input document formats supported include DOCX, PDF,\
        \ XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Consumeds 100 API calls per page."
      operationId: ExtractTables
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractTablesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTablesResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractTablesResponse"
          description: OK
      summary: Extract Tables of Data from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/barcodes:
    post:
      description: "Extract all barcodes from a document using AI.  Input document\
        \ formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG, HEIC\
        \ and WEBP.  Consumes 100 API calls per page."
      operationId: ExtractBarcodes
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractBarcodesAiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractBarcodesAiResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractBarcodesAiResponse"
          description: OK
      summary: Extract Barcodes of from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/all:
    post:
      description: "Extract all Fields and Tables, comprised of rows and columns of\
        \ data, from a document using AI.  Input document formats supported include\
        \ DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Consumes 100 API calls\
        \ per page."
      operationId: ExtractAllFieldsAndTables
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      - description: "Optional: Set the level of image pre-processing to enhance accuracy.\
          \  Possible values are 'Auto' (default), 'Paged', and 'Compatability'. \
          \ Use 'Paged' to treat each page as a separate document for extraction (requires\
          \ Advanced recognitionMode).  Default is Auto."
        in: header
        name: preprocessing
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
          description: OK
      summary: Extract All Fields and Tables of Data from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/classify:
    post:
      description: "Extract Classification or Category (e.g. Invoice, Receipt, Tax\
        \ Form, or Form 1040, Form 1040 EZ, etc.) from a document using AI.  Input\
