          FieldResults:
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
          - FieldName: FieldName
            FieldStringValue: FieldStringValue
            AdditionalFieldStringValues:
            - AdditionalFieldStringValues
            - AdditionalFieldStringValues
        ExtractClassificationResult:
          DocumentCategoryResult: DocumentCategoryResult
          Successful: true
        ExtractTextResult:
          PageResults:
          - TextResult: TextResult
            PageNumber: 0
          - TextResult: TextResult
            PageNumber: 0
