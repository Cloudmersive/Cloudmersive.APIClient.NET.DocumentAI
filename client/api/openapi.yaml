openapi: 3.0.1
info:
  description: "Use next-generation AI to extract data, fields, insights and text\
    \ from documents. Instantly."
  termsOfService: https://portal.cloudmersive.com/terms-of-service
  title: Document AI API
  version: v1
servers:
- url: /
security:
- Apikey: []
paths:
  /document-ai/document/analyze/enforce-policy:
    post:
      description: "Enforce Policies to a Document to allow or block it using Advanced\
        \ AI.  Input document formats supported include DOCX, PDF, PNG and JPG.  Consumes\
        \ 100 API calls per page."
      operationId: ApplyRules
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DocumentPolicyRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/DocumentPolicyRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/DocumentPolicyRequest"
        description: "Input request, including document and policy rules"
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DocumentPolicyResult"
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentPolicyResult"
            text/json:
              schema:
                $ref: "#/components/schemas/DocumentPolicyResult"
          description: OK
      summary: Enforce Policies to a Document to allow or block it using Advanced
        AI
      tags:
      - Analyze
      x-codegen-request-body-name: body
  /document-ai/document/extract/text:
    post:
      description: "Extract raw text from a document using AI.  Input document formats\
        \ supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Supports\
        \ a wide range of languages.  Consumes 100 API calls per page."
      operationId: ExtractText
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractTextResponse"
          description: OK
      summary: Extract Text from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/fields:
    post:
      description: "Extract Field Values (e.g. Invoice Number, Invoice Date, Business\
        \ Card Phone Number, etc.) from a document using AI.  Input document formats\
        \ supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Consumes\
        \ 100 API calls per page."
      operationId: ExtractFields
      parameters:
      - description: "Desired fields to extract, comma separated"
        in: header
        name: FieldNames
        schema:
          type: string
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractFieldsResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsResponse"
          description: OK
      summary: Extract Field Values from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/fields/advanced:
    post:
      description: "Extract Field Values (e.g. Invoice Number, Invoice Date, Business\
        \ Card Phone Number, etc.) from a document using Advanced AI.  Input document\
        \ formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and\
        \ WEBP.  Consumes 100 API calls per page."
      operationId: ExtractFieldsAdvanced
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
        description: "Input request, including document file as byte array, and information\
          \ on which fields to extract"
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAdvancedResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAdvancedResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAdvancedResponse"
          description: OK
      summary: Extract Field Values from a Document using Advanced AI
      tags:
      - Extract
      x-codegen-request-body-name: body
  /document-ai/document/extract/tables:
    post:
      description: "Extract Tables, comprised of rows and columns of data, from a\
        \ document using AI.  Input document formats supported include DOCX, PDF,\
        \ XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Consumeds 100 API calls per page."
      operationId: ExtractTables
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractTablesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractTablesResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractTablesResponse"
          description: OK
      summary: Extract Tables of Data from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/barcodes:
    post:
      description: "Extract all barcodes from a document using AI.  Input document\
        \ formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG, HEIC\
        \ and WEBP.  Consumes 100 API calls per page."
      operationId: ExtractBarcodes
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractBarcodesAiResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractBarcodesAiResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractBarcodesAiResponse"
          description: OK
      summary: Extract Barcodes of from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/all:
    post:
      description: "Extract all Fields and Tables, comprised of rows and columns of\
        \ data, from a document using AI.  Input document formats supported include\
        \ DOCX, PDF, XLSX, PPTX, EML, MSG, JPG, PNG and WEBP.  Consumes 100 API calls\
        \ per page."
      operationId: ExtractAllFieldsAndTables
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      - description: "Optional: Set the level of image pre-processing to enhance accuracy.\
          \  Possible values are 'Auto' (default), 'Paged', and 'Compatability'. \
          \ Use 'Paged' to treat each page as a separate document for extraction (requires\
          \ Advanced recognitionMode).  Default is Auto."
        in: header
        name: preprocessing
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractFieldsAndTablesResponse"
          description: OK
      summary: Extract All Fields and Tables of Data from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/classify:
    post:
      description: "Extract Classification or Category (e.g. Invoice, Receipt, Tax\
        \ Form, or Form 1040, Form 1040 EZ, etc.) from a document using AI.  Input\
        \ document formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG, JPG,\
        \ PNG and WEBP.  Consumes 100 API calls per page."
      operationId: ExtractClassification
      parameters:
      - description: Desired classification to extract
        in: header
        name: Categories
        schema:
          type: string
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DocumentClassificationResult"
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentClassificationResult"
            text/json:
              schema:
                $ref: "#/components/schemas/DocumentClassificationResult"
          description: OK
      summary: Extract Classification or Category from a Document using AI
      tags:
      - Extract
  /document-ai/document/extract/classify/advanced:
    post:
      description: "Extract Classification or Category (e.g. Invoice, Receipt, Tax\
        \ Form, or Form 1040, Form 1040 EZ, etc.) from a document using Advanced AI.\
        \  Input document formats supported include DOCX, PDF, XLSX, PPTX, EML, MSG,\
        \ JPG, PNG and WEBP.  Consumes 100 API calls per page."
      operationId: ExtractClassificationAdvanced
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractClassificationRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractClassificationRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractClassificationRequest"
        description: Input request to perform the classification on
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/DocumentAdvancedClassificationResult"
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentAdvancedClassificationResult"
            text/json:
              schema:
                $ref: "#/components/schemas/DocumentAdvancedClassificationResult"
          description: OK
      summary: Extract Classification or Category from a Document using Advanced AI
      tags:
      - Extract
      x-codegen-request-body-name: body
  /document-ai/document/extract/summary:
    post:
      description: "Creates a 1 paragraph summary of the input document using Artificial\
        \ Intelligence.  Input document formats supported include DOCX, PDF, XLSX,\
        \ PPTX, EML, MSG, JPG, PNG and WEBP.  Consumes 100 API calls per page."
      operationId: ExtractSummary
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/SummarizeDocumentResponse"
            application/json:
              schema:
                $ref: "#/components/schemas/SummarizeDocumentResponse"
            text/json:
              schema:
                $ref: "#/components/schemas/SummarizeDocumentResponse"
          description: OK
      summary: Extract Summary from a Document using AI
      tags:
      - Extract
  /document-ai/document/batch-job/extract/text:
    post:
      description: "Creates an async batch job for processing a large document as\
        \ an AI batch job.  Input document formats supported include DOCX, PDF, PNG\
        \ and JPG.  Supports a wide range of languages.  Requires Managed Instance\
        \ or Private Cloud deployment."
      operationId: ExtractTextFromDocumentBatchJob
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
          description: OK
      summary: Extract Text from a Document using AI as a Batch Job
      tags:
      - RunBatchJob
  /document-ai/document/batch-job/extract/fields/advanced:
    post:
      description: "Creates an async batch job for processing a large document as\
        \ an AI batch job.  Extract Field Values (e.g. Invoice Number, Invoice Date,\
        \ Business Card Phone Number, etc.) from a document using Advanced AI.  Input\
        \ document formats supported include DOCX, PDF, PNG and JPG.  Requires Managed\
        \ Instance or Private Cloud deployment."
      operationId: ExtractFieldsFromDocumentAdvancedBatchJob
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
          text/json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
          application/*+json:
            schema:
              $ref: "#/components/schemas/AdvancedExtractFieldsRequest"
        required: false
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
          description: OK
      summary: Extract Field Values from a Document using Advanced AI as a Batch Job
      tags:
      - RunBatchJob
      x-codegen-request-body-name: body
  /document-ai/document/batch-job/extract/all:
    post:
      description: "Creates an async batch job for processing a large document as\
        \ an AI batch job.  Extract all Fields and Tables, comprised of rows and columns\
        \ of data, from a document using AI.  Input document formats supported include\
        \ DOCX, PDF, PNG and JPG.  Requires Managed Instance or Private Cloud deployment."
      operationId: ExtractAllFieldsAndTablesFromDocumentBatchJob
      parameters:
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
          description: OK
      summary: Extract All Fields and Tables of Data from a Document using AI as a
        Batch Job
      tags:
      - RunBatchJob
  /document-ai/document/batch-job/extract/classify:
    post:
      description: "Creates an async batch job for processing a large document as\
        \ an AI batch job.  Extract Classification or Category (e.g. Invoice, Receipt,\
        \ Tax Form, or Form 1040, Form 1040 EZ, etc.) from a document using AI.  Input\
        \ document formats supported include DOCX, PDF, PNG and JPG.  Requires Managed\
        \ Instance or Private Cloud deployment."
      operationId: ExtractClassificationFromDocumentBatchJob
      parameters:
      - description: Desired classification to extract
        in: header
        name: Categories
        schema:
          type: string
      - description: "Optional; Recognition mode - Advanced (default) provides the\
          \ highest accuracy but slower speed, while Normal provides faster response\
          \ but lower accuracy for low quality images"
        in: header
        name: recognitionMode
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              $ref: "#/components/schemas/ExtractText_request"
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentBatchJobResult"
          description: OK
      summary: Extract Classification or Category from a Document using AI as a Batch
        Job
      tags:
      - RunBatchJob
  /document-ai/document/batch-job/batch-job/status:
    get:
      description: Returns the result of the Async Job - possible states can be STARTED
        or COMPLETED.  This API is only available for Cloudmersive Managed Instance
        and Private Cloud deployments.
      operationId: GetAsyncJobStatus
      parameters:
      - in: query
        name: AsyncJobID
        schema:
          type: string
      responses:
        "200":
          content:
            text/plain:
              schema:
                $ref: "#/components/schemas/ExtractDocumentJobStatusResult"
            application/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentJobStatusResult"
            text/json:
              schema:
                $ref: "#/components/schemas/ExtractDocumentJobStatusResult"
          description: OK
      summary: Get the status and result of an Extract Document Batch Job
      tags:
      - RunBatchJob
components:
  schemas:
    AdvancedExtractClassificationRequest:
      additionalProperties: false
      description: Request to perform an AI document classification on a document
      example:
        MaximumPagesProcessed: 0
        Preprocessing: Preprocessing
        Categories:
        - CategoryName: CategoryName
          CategoryDescription: CategoryDescription
        - CategoryName: CategoryName
          CategoryDescription: CategoryDescription
        ResultCrossCheck: ResultCrossCheck
        RotateImageDegrees: 6.027456183070403
        InputFile: InputFile
      properties:
        InputFile:
          description: Input document file to perform the operation on as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        Categories:
          description: Possible categories for the document
          items:
            $ref: "#/components/schemas/DocumentCategories"
          type: array
        Preprocessing:
          description: "Optional: Set the level of image pre-processing to enhance\
            \ accuracy.  Possible values are 'Auto', 'SmoothEdges', 'SmoothEdgesPlus',\
            \ 'Compatability' and 'None'.  Default is Auto.  Set to SmoothEdges to\
            \ smooth harsh edges in the input image to enhance recognition accuracy.\
            \  Set to SmoothEdgesPlus to smooth harsh edges to a higher degree.  Set\
            \ to Compatability for maximum PDF feature compatability."
          type: string
        ResultCrossCheck:
          description: "Optional: Set the level of output accuracy cross-checking\
            \ to perform on the input.  Possible values are 'None', 'Advanced', 'Ultra'\
            \ and 'Hyper'.  Default is None.  Ultra and Hyper will produce the highest\
            \ accuracy but at the cost of longer processing times."
          type: string
        MaximumPagesProcessed:
          description: "Optional: Limit the number of pages processed"
          format: int32
          type: integer
        RotateImageDegrees:
          description: "Optional: Rotate the input image before recognition by the\
            \ specified number of degrees; valid values range from -360 to +360."
          format: double
          type: number
      type: object
    AdvancedExtractFieldsRequest:
      additionalProperties: false
      description: Request to perform an AI field extraction on a document
      example:
        MaximumPagesProcessed: 0
        Preprocessing: Preprocessing
        ResultCrossCheck: ResultCrossCheck
        RotateImageDegrees: 6.027456183070403
        FieldsToExtract:
        - FieldOptional: true
          FieldExample: FieldExample
          FieldName: FieldName
          FieldDescription: FieldDescription
        - FieldOptional: true
          FieldExample: FieldExample
          FieldName: FieldName
          FieldDescription: FieldDescription
        InputFile: InputFile
      properties:
        InputFile:
          description: Input document file to perform the operation on as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        FieldsToExtract:
          description: Fields to extract from the document
          items:
            $ref: "#/components/schemas/FieldToExtract"
          type: array
        MaximumPagesProcessed:
          description: "Optional: Limit the number of pages processed"
          format: int32
          type: integer
        Preprocessing:
          description: "Optional: Set the level of image pre-processing to enhance\
            \ accuracy.  Possible values are 'Auto', 'SmoothEdges', 'SmoothEdgesPlus',\
            \ 'ContrastEdges', 'ContrastEdgesPlus', 'Invert', 'Binarize', 'Compatability'\
            \ and 'None'.  Default is Auto.  Set to SmoothEdges to smooth harsh edges\
            \ in the input image to enhance recognition accuracy.  Set to SmoothEdgesPlus\
            \ to smooth harsh edges to a higher degree.  Set to ContrastEdges and\
            \ ContrastEdgesPlus to enhance contrast and readability for low quality\
            \ black and white or grayscale images.  Set to Invert to invert the input\
            \ image.  Set to Binarize to binarize the input image.  Set to Compatability\
            \ for maximum PDF feature compatability."
          type: string
        ResultCrossCheck:
          description: "Optional: Set the level of output accuracy cross-checking\
            \ to perform on the input.  Possible values are 'None', 'Advanced' and\
            \ 'Ultra'.  Default is None.  Ultra will produce the highest accuracy\
            \ but at the cost of longer processing times."
          type: string
        RotateImageDegrees:
          description: "Optional: Rotate the input image before recognition by the\
            \ specified number of degrees; valid values range from -360 to +360."
          format: double
          type: number
      type: object
    DocumentAdvancedClassificationResult:
      additionalProperties: false
      description: Result of classifying a document using AI
      example:
        DocumentCategoryResult: DocumentCategoryResult
        ConfidenceScore: 0.8008281904610115
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        DocumentCategoryResult:
          description: Category applied to the document; if a category could not be
            identified then "other" will be used.  Spaces are replaced with underscores.
          type: string
        ConfidenceScore:
          description: "Confidence score between 0.0 and 1.0, where values > 0.8 indicate\
            \ high confidence"
          format: double
          type: number
      type: object
    DocumentCategories:
      additionalProperties: false
      description: Document category option
      example:
        CategoryName: CategoryName
        CategoryDescription: CategoryDescription
      properties:
        CategoryName:
          description: Name of the classification
          type: string
        CategoryDescription:
          description: "Optional but recommended: Description of the classification\
            \ in natural langugage"
          type: string
      type: object
    DocumentClassificationResult:
      additionalProperties: false
      description: Result of classifying a document using AI
      example:
        DocumentCategoryResult: DocumentCategoryResult
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        DocumentCategoryResult:
          description: Category applied to the document; if a category could not be
            identified then "other" will be used.  Spaces are replaced with underscores.
          type: string
      type: object
    DocumentPolicyRequest:
      additionalProperties: false
      description: Request to analyze a document
      example:
        Rules:
        - RuleDescription: RuleDescription
          RuleId: RuleId
          RuleType: RuleType
        - RuleDescription: RuleDescription
          RuleId: RuleId
          RuleType: RuleType
        InputFile: InputFile
      properties:
        InputFile:
          description: Input file as a byte array
          format: byte
          pattern: "^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$"
          type: string
        Rules:
          description: Rules to apply to the document
          items:
            $ref: "#/components/schemas/PolicyRule"
          type: array
      type: object
    DocumentPolicyResult:
      additionalProperties: false
      description: Result of performing a document policy enforcement operation
      example:
        RiskScore: 0.8008281904610115
        RuleViolations:
        - RuleId: RuleId
          RuleViolationRiskScore: 6.027456183070403
          RuleViolationRationale: RuleViolationRationale
        - RuleId: RuleId
          RuleViolationRiskScore: 6.027456183070403
          RuleViolationRationale: RuleViolationRationale
        CleanResult: true
      properties:
        CleanResult:
          description: "True if the document complies with all of the policies, and\
            \ false if it does not"
          type: boolean
        RiskScore:
          description: Risk score between 0.0 and 1.0 where values above 0.5 are increasing
            levels of risk
          format: double
          type: number
        RuleViolations:
          description: Policy violations
          items:
            $ref: "#/components/schemas/PolicyRuleViolation"
          type: array
      type: object
    ExtractBarcodesAiResponse:
      additionalProperties: false
      description: Result of extracting barcodes from a document
      example:
        BarcodeResults:
        - BarcodeValue: BarcodeValue
          BarcodeType: BarcodeType
        - BarcodeValue: BarcodeValue
          BarcodeType: BarcodeType
        Successful: true
      properties:
        Successful:
          description: "True if successful, false otherwise"
          type: boolean
        BarcodeResults:
          description: Table value results from the extraction operation
          items:
            $ref: "#/components/schemas/ExtractedBarcodeItem"
          type: array
      type: object
    ExtractDocumentBatchJobResult:
      additionalProperties: false
